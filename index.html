    <link rel="apple-touch-icon" href="./logo-mark.svg" />

    <meta property="og:image:type" content="image/svg+xml" />

    <meta name="twitter:image" content="https://avivgvili6-pixel.github.io/businessos/og-image.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Heebo:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Heebo', 'Segoe UI', sans-serif; direction: rtl; background: #14120f; color: #eeece5; color-scheme: dark; }

      /* Force all form inputs to render light text (fixes iOS/Android forced-color
         theming that made typed text render white-on-white or otherwise invisible) */
      input, textarea, select {
        color: #eeece5 !important;
        -webkit-text-fill-color: #eeece5 !important;
        color-scheme: dark;
      }
      input::placeholder, textarea::placeholder {
        color: #7a7167 !important;
        -webkit-text-fill-color: #7a7167 !important;
        opacity: 1;
      }
      /* Number input: iOS sometimes ignores color:. Force it. */
      input[type=number], input[type=text], input[type=email], input[type=password], input[type=tel], input[type=search] {
        color: #eeece5 !important;
        -webkit-text-fill-color: #eeece5 !important;
        caret-color: #c74050;
      }
      #root { min-height: 100vh; }
            @media (min-width: 641px) {
        #root { max-width: 480px; margin: 0 auto; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
      }
      input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; background: #2d2925; border-radius: 2px; outline: none; }
      input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #a52a3a; cursor: pointer; }
      select { appearance: none; -webkit-appearance: none; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 2px; }

      /* Suppress Chrome/Safari autofill styling that overrides our dark inputs.
         Without this, saved emails render on WHITE background with red hints
         and a stray '{}' autofill glyph — which looked like a real error. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #1c1917 inset !important;
        -webkit-text-fill-color: #eeece5 !important;
        caret-color: #a52a3a;
        transition: background-color 5000s ease-in-out 0s !important;
      }
      /* Chrome on Android sometimes injects a data-list arrow / autofill icon
         that renders as a small '{}' glyph. Hide it. */
      input::-webkit-list-button,
      input::-webkit-calendar-picker-indicator,
      input::-webkit-inner-spin-button { display: none !important; opacity: 0; }
      input::-webkit-contacts-auto-fill-button,
      input::-webkit-credentials-auto-fill-button { visibility: hidden !important; display: none !important; pointer-events: none !important; position: absolute !important; right: 0; }

      /* Boot loader — a big S that cycles through Selano's palette
         (wine → silver → charcoal) while the JS bundle downloads
         and React mounts. The loader lives outside #root so it can
         paint before the framework boots; #root replaces it as soon
         as the app renders anything. */
      .hfos-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0f0d0b;
        pointer-events: none;
      }
      .hfos-boot-s {
        font-family: 'Barlow', 'Barlow Condensed', 'Oswald', sans-serif;
        font-weight: 800; font-size: clamp(140px, 32vw, 260px);
        line-height: 1; letter-spacing: -0.05em;
        animation: hfos-boot-cycle 1.6s ease-in-out infinite;
        text-shadow: 0 0 40px currentColor;
      }
      @keyframes hfos-boot-cycle {
        0%   { color: #c74050; transform: scale(1); }
        33%  { color: #c9c1b1; transform: scale(1.04); }
        66%  { color: #14120f; transform: scale(1); text-shadow: 0 0 40px #a52a3a; }
        100% { color: #c74050; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="hfos-boot" id="hfos-boot"><div class="hfos-boot-s">S</div></div>
    <div id="root"></div>
    <script>
      // Remove the boot loader as soon as React puts anything in #root.
      // Fallback timeout of 8s in case something breaks — we don't want
      // to trap the user under the loader.
      (function () {
        var boot = document.getElementById('hfos-boot');
        if (!boot) return;
        var kill = function () {
          boot.style.transition = 'opacity 300ms ease';
          boot.style.opacity = '0';
          setTimeout(function () { boot.remove(); }, 320);
        };
        var mo = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) { kill(); mo.disconnect(); }
        });
        var root = document.getElementById('root');
        if (root) mo.observe(root, { childList: true });
        setTimeout(function () { kill(); mo.disconnect(); }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
